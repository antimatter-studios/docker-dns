name: Merge on green

# Hands a pull request to the merge queue as soon as CI passes on it.
#
# The queue, not this workflow, does the merge: it rebuilds the pull request on top of
# main and everything queued ahead of it, runs CI on that (the merge_group event), and
# squash-merges only if it passes. Two pull requests that go green together therefore
# both land, in turn, instead of the second failing as out of date. The queue's merge
# is a normal push to main, which starts the Docker workflow that publishes the image.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge
    # A successful CI run on a pull request from this repository (Dependabot's
    # included). Pull requests from forks are left for a person.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Add the pull request to the merge queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
            --json number,isDraft,baseRefName,headRefOid \
            --jq '.[] | select(.headRefOid == env.HEAD_SHA and (.isDraft | not) and .baseRefName == env.BASE) | .number' | head -1)
          if [ -z "$pr" ]; then
            echo "No open, ready pull request into $BASE at $HEAD_SHA."
            exit 0
          fi
          # Only the commit CI just passed, never one pushed since. With the queue
          # required, this enqueues rather than merges; the queue squash-merges, and the
          # repository deletes the branch once it has.
          gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$HEAD_SHA"
